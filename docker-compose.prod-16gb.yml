# ==============================================================================
# CẤU HÌNH PRODUCTION TỐI ƯU CHO MÁY ẢO 16GB RAM / 8 vCPU (Phương án 1 + 3)
# Target: Máy chủ Linux 8 vCPU, 16 GiB RAM, SSD
# ==============================================================================
# Hướng dẫn chạy Production trên máy ảo 16GB RAM:
#   docker compose -f docker-compose.yml -f docker-compose.prod-16gb.yml up -d
#
# Các tối ưu đã áp dụng (Phương án 1 + Phương án 3):
# 1. [Phương án 3 - Tách Embedding khỏi OpenWebUI Workers]:
#    - Chuyển RAG_EMBEDDING_ENGINE sang 'openai' gọi qua Middleware (http://middleware:5000/v1)
#      tới model 'gemini-embedding-001' (hoặc 'gemini-embedding-2'), tự động ép về 1536 chiều
#      khớp với PGVector HNSW và được tính toán quota/audit trong Middleware.
#    - Nhờ không phải nạp 6 bản model AITeamVN/Vietnamese_Embedding vào RAM của từng worker,
#      RAM của open-webui giảm từ ~9GB xuống chỉ còn ~800MB - 1.5GB!
# 2. [Phương án 1 - Cân bằng Worker & Khớp trần RAM 13.0GB / 8 vCPU]:
#    - open-webui: 2 Uvicorn workers (đồng bộ WebSocket qua Redis DB 1), limit 2560M RAM / 2.5 CPU
#    - docling (PaddleOCR vi,en): 2 Uvicorn workers xử lý song song, LOG_LEVEL=INFO, limit 3328M RAM / 3.0 CPU
#    - postgres (pgvector): max_connections=150, shared_buffers=1GB, effective_cache_size=3GB, limit 2048M RAM / 1.5 CPU
#    - litellm: 2 workers, limit 2304M RAM / 1.5 CPU
#    - middleware: 2 workers, limit 768M RAM / 1.0 CPU
#    - searxng (512M) + redis (256M) + code-sandbox (512M) + mcpo (768M) + nginx (256M): tổng limit 2304M RAM
#    => Tổng trần RAM (Hard Limit) toàn bộ 10 containers = 13.0 GiB.
# ==============================================================================

services:
  # 1. PostgreSQL 16 + PGVector (Tối ưu cho máy 16GB RAM)
  postgres:
    command: >
      postgres
      -c max_connections=150
      -c shared_buffers=1GB
      -c work_mem=8MB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=128MB
      -c wal_buffers=32MB
      -c random_page_cost=1.1
      -c checkpoint_completion_target=0.9
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1.5'
        reservations:
          memory: 1G

  # 2. Redis (SearXNG rate limiter DB 0 + WebSocket sync DB 1)
  redis:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # 3. LiteLLM Proxy (2 workers cân bằng với Middleware & OpenWebUI — 2.25GB tránh cgroup swap)
  litellm:
    command: [ "--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2" ]
    deploy:
      resources:
        limits:
          memory: 2304M
          cpus: '1.5'
        reservations:
          memory: 1G

  # 4. Middleware (Hạ từ 4 xuống 2 workers cho cân bằng chuỗi I/O)
  middleware:
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "5000", "--workers", "2" ]
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 256M

  # 5. SearXNG (Meta Search Engine)
  searxng:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # 6. Docling OCR (Tăng lên 2 workers để 2 người upload PDF không chặn nhau, tắt DEBUG log)
  docling:
    environment:
      - UVICORN_WORKERS=2
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - DOCLING_SERVE_MAX_SYNC_WAIT=600
      - DOCLING_SERVE_LOG_LEVEL=INFO
      - DOCLING_SERVE_DEFAULT_OCR_ENGINE=paddleocr
      - DOCLING_SERVE_DEFAULT_OCR_LANGS=vi,en
      - DOCLING_SERVE_OCR_LANGS=vi,en
      - OCR_LANGS=vi,en
      - PADDLE_LANG=vi
      - DOCLING_SERVE_IMAGE_EXPORT=true
    deploy:
      resources:
        limits:
          memory: 3328M
          cpus: '3.0'
        reservations:
          memory: 1G

  # 7. Open WebUI Core (Phương án 3: Tách Embedding qua Middleware/LiteLLM + 2 Workers)
  open-webui:
    environment:
      # --- PHƯƠNG ÁN 3: Tách Embedding ra khỏi RAM của OpenWebUI ---
      # Gọi qua Middleware (/v1/embeddings) -> LiteLLM (gemini-embedding-001, 1536 dims)
      # Giúp mỗi worker không phải gánh 1.3GB model Vietnamese_Embedding trong RAM
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_EMBEDDING_MODEL=gemini-embedding-001
      - RAG_EMBEDDING_OPENAI_API_BASE_URL=http://middleware:5000/v1
      - RAG_EMBEDDING_OPENAI_API_KEY=${SUBKEY_ADMIN}
      - RAG_EMBEDDING_BATCH_SIZE=50
      # --- PHƯƠNG ÁN 1: 2 Workers đồng bộ qua Redis ---
      - UVICORN_WORKERS=2
    deploy:
      resources:
        limits:
          memory: 2560M
          cpus: '2.5'
        reservations:
          memory: 1G

  # 8. Code Sandbox (Jupyter Kernel cô lập)
  code-sandbox:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # 9. MCPO (MCP-to-OpenAPI Proxy — mount ./scripts cho office365_mcp.py & cache npx/uvx)
  mcpo:
    volumes:
      - ./scripts:/app/scripts:ro
      - mcpo_npm_cache:/root/.npm
      - mcpo_uv_cache:/root/.cache
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'

  # 10. Nginx Reverse Proxy (Entrypoint duy nhất cổng 3000 HTTPS)
  nginx:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

volumes:
  mcpo_npm_cache:
    driver: local
  mcpo_uv_cache:
    driver: local
